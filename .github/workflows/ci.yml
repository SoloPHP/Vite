name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.3'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      # composer.lock is not committed: dependencies resolve for each PHP version.
      - run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
      - run: composer check

  without-twig:
    name: PHP 8.3 without Twig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - run: composer remove --dev twig/twig --no-update
      - run: composer update --prefer-dist --no-interaction --no-progress
      # Twig is optional: everything but the extension works without it.
      - run: vendor/bin/phpunit --exclude-group twig
